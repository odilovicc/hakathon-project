<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Узнай, сколько можно потратить сегодня, найди экономию и начни копить на свою цель. Кубышка — бесплатный личный бюджет с живым питомцем. Ташкент, суммы в сумах."
    />
    <meta name="theme-color" content="#F4EDE4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Кубышка — деньги на сегодня. Накопления на своё." />
    <meta
      property="og:description"
      content="Понятный остаток на день, свои цели и Кубыш, который растёт вместе с накоплениями. Начни бесплатно."
    />
    <meta property="og:locale" content="ru_RU" />
    <title>Кубышка — деньги на сегодня. Накопления на своё.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700;800&display=swap"
    />
    <script>
      // Тема применяется до отрисовки, чтобы не было вспышки светлой темы.
      try {
        var t = JSON.parse(localStorage.getItem('kubyshka-ui') || '{}').state?.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
